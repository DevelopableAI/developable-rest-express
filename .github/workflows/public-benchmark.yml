name: Public Benchmark

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      DEVELOPABLE_RUN_PUBLIC_BENCHMARK: '1'
      DEVELOPABLE_PUBLIC_BENCHMARK_CACHE: .developable-rest-express/cache/repos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: mkdir -p benchmark-reports
      - run: developable-rest-express prepare-benchmark benchmarks/public/express_v1.yaml --cache-root .developable-rest-express/cache/repos
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Export calibration dataset from the current detectors
        run: |
          developable-rest-express export-calibration-dataset benchmarks/public/express_v1.yaml \
            --cache-root .developable-rest-express/cache/repos \
            --output-path benchmark-reports/express_v1.actual.jsonl
      - run: developable-rest-express evaluate-benchmark benchmarks/public/express_v1.yaml --cache-root .developable-rest-express/cache/repos --output json > benchmark-reports/express_v1.json
      - run: developable-rest-express evaluate-benchmark benchmarks/public/express_v1.yaml --cache-root .developable-rest-express/cache/repos --output md > benchmark-reports/express_v1.md
      - uses: actions/upload-artifact@v4
        with:
          name: public-express-benchmark
          path: benchmark-reports/

      # Runs last, and deliberately after upload-artifact: when detector output
      # changes on purpose this step fails, and the exported dataset must still
      # be downloadable so it can be reviewed and promoted to the new baseline.
      - name: Assert detector output matches the committed calibration baseline
        run: |
          diff <(sort benchmarks/public/calibration/express_v1.jsonl) \
               <(sort benchmark-reports/express_v1.actual.jsonl)
