notes:
  - All sources satisfy the public corpus policy and are pinned to full Git commit SHAs; the committed V1 sources happened to be MIT-licensed.
  - Labels are manually reviewed benchmark truth and may intentionally disagree with detector output.
  - Expansion batch 01 was reviewed against the recorded SHA-pinned checkouts on 2026-08-05; direct ORM access corrected three layering labels.
  - Expansion batch 02 added ten policy-compliant repositories after SHA-pinned source inspection on 2026-08-05; it intentionally includes unsupported direct-data-access and handler-layer patterns.
  - Expansion batch 03 added eight policy-compliant repositories after SHA-pinned source inspection on 2026-08-05; it brings the calibration corpus to 34 repositories and 204 convention rows.
