expected_conventions:
  node-express-boilerplate:
    route_declaration_style: express_router_modules
    route_controller_boundary: routes_call_controllers
    validation_at_edge_pattern: route_validation_middleware
    service_repository_layering: controller_service_model
    auth_middleware_presence: auth_middleware_present
    test_layout_shape: jest_supertest_layout
  node-express-typeorm-boilerplate:
    route_declaration_style: express_router_modules
    route_controller_boundary: routes_call_controllers
    validation_at_edge_pattern: route_validation_middleware
    service_repository_layering: controller_manager_model
    auth_middleware_presence: auth_middleware_present
    test_layout_shape: no_clear_tests
  express-typescript-boilerplate:
    route_declaration_style: decorator_routing
    route_controller_boundary: routes_call_controllers
    validation_at_edge_pattern: validation_middleware
    service_repository_layering: controller_service_repository
    auth_middleware_presence: auth_middleware_present
    test_layout_shape: jest_test_layout
  bulletproof-nodejs:
    route_declaration_style: express_router_modules
    route_controller_boundary: routes_call_services
    validation_at_edge_pattern: route_validation_middleware
    service_repository_layering: service_data_access
    auth_middleware_presence: auth_middleware_present
    test_layout_shape: jest_test_layout
  express-typescript:
    route_declaration_style: feature_router_modules
    route_controller_boundary: routes_call_controllers
    validation_at_edge_pattern: zod_validation_middleware
    service_repository_layering: feature_service_layer
    auth_middleware_presence: auth_middleware_unclear
    test_layout_shape: vitest_test_layout
  express-mongoose-es6-rest-api:
    route_declaration_style: express_router_modules
    route_controller_boundary: routes_call_controllers
    validation_at_edge_pattern: route_validation_middleware
    service_repository_layering: controller_model
    auth_middleware_presence: auth_middleware_present
    test_layout_shape: jest_supertest_layout

notes:
  - All sources are public MIT-licensed repositories pinned to full Git commit SHAs.
  - Labels are manually reviewed benchmark truth and may intentionally disagree with detector output.
